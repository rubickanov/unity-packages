name: Generate Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_ROOT: /usr/lib/dotnet
  PATH: /home/rubickanov/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  docs:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Generate documentation
        run: |
          chmod +x docs/generate.sh
          docs/generate.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_site/
          retention-days: 30
